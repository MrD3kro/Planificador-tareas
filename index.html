<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clockydo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="app" class="app" data-bs-theme="light">

        <header class="topbar d-flex align-items-center">
            <div class="logo d-flex align-items-center justify-content-center fw-semibold">C</div>
            <span class="mx-auto fw-semibold fs-5">Clockydo</span>
            <button class="btn btn-sm btn-outline-secondary me-2">Conoce más</button>
            <button class="btn btn-sm btn-outline-secondary me-2" onclick="toggleTheme()">Tema</button>
            <div class="dropdown">
                <button class="btn btn-sm btn-primary dropdown-toggle" data-bs-toggle="dropdown">Usuario</button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#">Perfil</a></li>
                    <li><a class="dropdown-item" href="#">Cerrar sesión</a></li>
                </ul>
            </div>
        </header>

        <main class="shell">
            <aside class="sidebar">
                <p class="small text-secondary mb-2">Menú</p>
                <div class="nav nav-pills flex-column gap-1">
                    <button class="nav-link text-start active" data-go="day" onclick="setView('day')">Day</button>
                    <button class="nav-link text-start" data-go="month" onclick="setView('month')">Calendar</button>
                </div>
                <div data-only="month" hidden class="mt-4">
                    <p class="small text-secondary mb-2">Etiquetas</p>
                    <div class="d-grid gap-2">
                        <button class="btn btn-sm tag text-start" style="background:#BFE3C8">Trabajo</button>
                        <button class="btn btn-sm tag text-start" style="background:#F6C6D8">Estudio</button>
                        <button class="btn btn-sm tag text-start" style="background:#F8E7A6">Hogar</button>
                        <button class="btn btn-sm tag text-start" style="background:#C9D3F5">Personal</button>
                        <button class="btn btn-sm tag text-start" style="background:#D9C8F0">Ideas</button>
                    </div>
                </div>
            </aside>

            <section class="content">

                <div data-only="day">
                    <h2 class="h5 mb-3">Planificador day</h2>
                    <div class="row g-3">
                        <div class="col-6">
                            <div class="board-col">
                                <h3 class="h6 mb-3">In progress</h3>
                                <div class="task d-flex align-items-center gap-2 mb-2">
                                    <input class="form-check-input mt-0" type="checkbox">
                                    <span class="flex-grow-1">Tarea</span>
                                    <span class="badge text-bg-secondary">25:00</span>
                                </div>
                                <div class="task mb-2">
                                    <div class="d-flex align-items-center gap-2">
                                        <input class="form-check-input mt-0" type="checkbox">
                                        <span class="flex-grow-1">Tarea 2</span>
                                        <span class="badge text-bg-secondary">12:40</span>
                                    </div>
                                    <div class="btn-group btn-group-sm w-100 mt-2">
                                        <button class="btn btn-outline-secondary">−</button>
                                        <button class="btn btn-outline-secondary">Stop</button>
                                        <button class="btn btn-outline-secondary">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="board-col">
                                <h3 class="h6 mb-3">Done</h3>
                                <div class="task d-flex align-items-center gap-2">
                                    <input class="form-check-input mt-0" type="checkbox" checked>
                                    <span class="flex-grow-1 text-decoration-line-through text-secondary">Tarea</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div data-only="month" hidden>
                    <h2 class="h5 mb-3">Planificador month · octubre 2026</h2>
                    <div class="cal" id="cal"></div>
                </div>

            </section>
        </main>

        <nav class="dock nav nav-pills position-fixed bottom-0 start-50 translate-middle-x mb-3 p-1 rounded-pill shadow">
            <button class="nav-link rounded-pill active" data-go="day" onclick="setView('day')">Day</button>
            <button class="nav-link rounded-pill" data-go="month" onclick="setView('month')">Month</button>
        </nav>
        <button class="btn btn-primary fab rounded-circle position-fixed bottom-0 start-0 m-3"
            aria-label="Ayuda">?</button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const app = document.getElementById('app');

        function setView(v) {
            document.querySelectorAll('[data-only]').forEach(e => e.hidden = e.dataset.only !== v);
            document.querySelectorAll('[data-go]').forEach(b => b.classList.toggle('active', b.dataset.go === v));
        }

        function toggleTheme() {
            app.dataset.bsTheme = app.dataset.bsTheme === 'dark' ? 'light' : 'dark';
        }

        const cal = document.getElementById('cal');
        ['L', 'M', 'X', 'J', 'V', 'S', 'D'].forEach(d => cal.insertAdjacentHTML('beforeend', `<div class="dow">${d}</div>`));
        const ev = { 15: ['Estudio', '#F6C6D8'], 28: ['Tarea 1', '#BFE3C8'], 30: ['Entrega', '#F8E7A6'] };
        for (let i = 0; i < 35; i++) {
            const n = i - 2, e = ev[n];
            cal.insertAdjacentHTML('beforeend',
                `<div class="${n === 28 ? 'today' : ''}">${n > 0 && n <= 31 ? n : ''}${e ? `<span class="ev" style="background:${e[1]}">${e[0]}</span>` : ''}</div>`);
        }
    </script>
</body>

</html>
